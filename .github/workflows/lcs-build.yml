name: LCS build

# LCS 改造线专用：编译 + 单测 + 出 debug APK，产物留在 Actions 里供下载。
# 上游的 android-ci.yml 只跑 main，这里覆盖 lcs/* 分支。
on:
  push:
    branches:
      - "lcs/**"
      - "ci/**"
  pull_request:
    branches:
      - "lcs/**"
      - "ci/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lcs-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain --stacktrace

      - name: Collect diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lcs-diagnostics
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Collect APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lcs-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
