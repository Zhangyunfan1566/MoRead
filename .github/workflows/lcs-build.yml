name: LCS build

# LCS 改造线专用：编译 + 单测 + 出 debug APK，产物留在 Actions 里供下载。
# 上游的 android-ci.yml 只跑 main，这里覆盖 lcs/** 与 ci/**（基线对照分支）。
on:
  push:
    branches:
      - "lcs/**"
      - "ci/**"
  pull_request:
    branches:
      - "lcs/**"
      - "ci/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lcs-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      # 单测不阻断后续步骤：2574 项里有两项是上游自带的 Robolectric/Compose 抖动，
      # 一挂就跳过打包等于拿不到任何产物。测试结论仍然让整个 job 变红（见最后一步）。
      - name: Unit tests
        id: tests
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest --console=plain --stacktrace

      - name: Assemble debug APK
        if: ${{ !cancelled() }}
        run: ./gradlew :app:assembleDebug --console=plain --stacktrace

      - name: Collect diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lcs-diagnostics
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Collect APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lcs-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      # 编译过、APK 也出了，但单测有失败 → 仍然把 job 判红，不许悄悄放过。
      - name: Fail when unit tests failed
        if: ${{ steps.tests.outcome == 'failure' }}
        run: |
          echo "单测有失败，详见 lcs-diagnostics 产物里的 test-results。"
          exit 1
